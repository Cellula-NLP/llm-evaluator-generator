[project]
name = "nlp-evaluator-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "httpx>=0.27",
    "structlog>=24.1",
    "redis>=5.0",
    "qdrant-client>=1.9,<1.10",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "langchain-text-splitters>=0.2",
    "faster-whisper>=1.0",
    "pymupdf==1.24.5",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "beautifulsoup4>=4.12",
    "numpy<2",
    "torch==2.2.2",
    "transformers==4.57.6",
    "sentence-transformers==2.7.0",
    "langchain-groq>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"