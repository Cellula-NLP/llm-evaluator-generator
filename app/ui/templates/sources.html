{% extends "base.html" %}
{% block content %}
<h1>Sources</h1>

<div class="card" style="padding: 0; overflow: hidden;">
  {% if sources %}
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Kind</th>
        <th>Chunks</th>
        <th>Bytes</th>
        <th>Status</th>
        <th style="text-align: right;">Action</th>
      </tr>
    </thead>
    <tbody>
      {% for s in sources %}
      <tr>
        <td style="font-weight: 500;">{{ s.name }}</td>
        <td><span class="badge">{{ s.kind }}</span></td>
        <td>{{ s.chunks }}</td>
        <td>{{ s.bytes }}</td>
        <td><span class="badge badge-teal">{{ s.status }}</span></td>
        <td style="text-align: right;">
          <button class="btn-danger"
                  hx-delete="/api/sources/{{ s.source_id }}"
                  hx-confirm="Delete this source?"
                  hx-swap="none"
                  hx-on::after-request="location.reload()">Delete</button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <div style="text-align: center; padding: 3rem 1rem;">
    <p style="color: var(--gray-500); margin-bottom: 1.5rem;">No sources yet.</p>
    <a href="/ui/ingest" class="btn btn-primary" style="text-decoration: none;">Ingest your first document</a>
  </div>
  {% endif %}
</div>
{% endblock %}
