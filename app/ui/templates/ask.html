{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
  <h1 style="margin: 0;">Ask</h1>
  <button id="clear-chat" class="btn-danger">Clear Chat</button>
</div>

<form id="ask-form" style="margin-bottom: 2rem; flex-direction: column; align-items: stretch;">
  <textarea name="question" rows="3" placeholder="Ask a question..." required></textarea>
  <button type="submit" style="margin-top: 0.75rem;">Ask</button>
</form>

<div id="history"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>

<script>
const renderMd = (text) => {
  if (!text) return '';
  return DOMPurify.sanitize(marked.parse(text));
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const historyDiv = document.getElementById('history');

function loadHistory() {
  const saved = localStorage.getItem('chat_history');
  if (saved) historyDiv.innerHTML = saved;
}

function saveHistory() {
  localStorage.setItem('chat_history', historyDiv.innerHTML);
}

document.getElementById('clear-chat').addEventListener('click', () => {
  localStorage.removeItem('chat_history');
  historyDiv.innerHTML = '';
});

loadHistory();

document.getElementById('ask-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = e.target.question.value;
  e.target.reset();

  const block = document.createElement('div');
  block.className = 'qa-block';

  // ADDED dir="auto" to user-q and md-content
  block.innerHTML = `
    <div class="user-q" dir="auto">Q: ${esc(question)}</div>
    <div class="bot-a">
      <div class="status" style="color: var(--teal-600); font-weight: 500;">Thinking…</div>
      <div class="final-answer" style="display: none;"></div>
      <details style="display: none; margin-top: 1rem;">
        <summary>🔍 Inspect Evaluator Loop</summary>
        <div class="inspector-content"></div>
      </details>
    </div>
  `;
  historyDiv.prepend(block);
  saveHistory();

  const statusDiv = block.querySelector('.status');
  const finalDiv = block.querySelector('.final-answer');
  const detailsTag = block.querySelector('details');
  const inspectorContent = block.querySelector('.inspector-content');

  try {
    const res = await fetch('/api/query/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question: question })
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error?.message || `Server Error (${res.status})`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let finalData = null;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n\n');

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = JSON.parse(line.slice(6));

        if (payload.event === 'status') {
          statusDiv.textContent = payload.data.message;
        }
        else if (payload.event === 'iteration') {
          const t = payload.data;
          const ev = t.evaluation;

          if (detailsTag.style.display === 'none') {
            detailsTag.style.display = 'block';
            statusDiv.style.display = 'none';
            finalDiv.style.display = 'block';
            finalDiv.innerHTML = `<span style="color:var(--gray-500);font-style:italic;">Synthesizing final answer...</span>`;
          }

          // ADDED dir="auto" to iteration md-content
          let iterHtml = `<div class="iteration">
            <h3>Iteration ${t.iteration}</h3>
            <div class="md-content" dir="auto">${renderMd(t.answer)}</div>
            <div style="margin-top: 1rem;">
              <span class="badge ${ev.is_acceptable ? 'badge-teal' : 'badge-red'}">
                ${ev.is_acceptable ? 'Acceptable' : 'Needs Improvement'}
              </span>
              <span class="badge">Acc ${ev.accuracy}/5</span>
              <span class="badge">Rel ${ev.relevance}/5</span>
              <span class="badge">Comp ${ev.completeness}/5</span>
            </div>
          `;
          if (t.feedback) {
            iterHtml += `<div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--gray-200);">
                           <strong style="color: var(--teal-700);">Evaluator Feedback:</strong>
                           <div class="md-content" dir="auto">${renderMd(t.feedback)}</div>
                         </div>`;
          }
          iterHtml += `</div>`;

          inspectorContent.insertAdjacentHTML('beforeend', iterHtml);
          saveHistory();
        }
        else if (payload.event === 'final') {
          finalData = payload.data;
        }
      }
    }

    if (finalData) {
      statusDiv.style.display = 'none';
      finalDiv.style.display = 'block';

      const badges = [];
      if (finalData.refusal) badges.push(`<span class="badge badge-red">Refusal</span>`);
      badges.push(`<span class="badge ${finalData.validated ? 'badge-teal' : 'badge-red'}">${finalData.validated ? 'Validated' : 'Not Validated'}</span>`);
      if (finalData.grounded) badges.push(`<span class="badge badge-teal">Grounded</span>`);
      badges.push(`<span class="badge">Iterations: ${finalData.iterations}</span>`);

      // ADDED dir="auto" to final answer
      let html = `<div class="md-content" dir="auto">${renderMd(finalData.answer)}</div>`;
      html += `<div class="badges">${badges.join('')}</div>`;
      if (finalData.warning) html += `<p style="color: var(--red-500); font-size: 0.9rem; margin-top: 1rem;">⚠ ${finalData.warning}</p>`;

      finalDiv.innerHTML = html;
      saveHistory();
    }

  } catch (error) {
    statusDiv.style.display = 'none';
    finalDiv.style.display = 'block';
    finalDiv.innerHTML = `<p style="color: var(--red-500); font-weight: 600;">⚠ Error: ${esc(error.message)}</p>`;
    saveHistory();
  }
});
</script>
{% endblock %}
