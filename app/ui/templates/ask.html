{% extends "base.html" %}
{% block content %}
<h1>Ask</h1>
<form id="ask-form">
  <textarea name="question" rows="3" placeholder="Ask a question..." required></textarea>
  <button type="submit">Ask</button>
</form>

<!-- Container for the chat history -->
<div id="history" style="margin-top: 2rem;"></div>

<!-- Markdown parser and sanitizer -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>

<script>
const renderMd = (text) => {
  if (!text) return '';
  return DOMPurify.sanitize(marked.parse(text));
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.getElementById('ask-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = e.target.question.value;
  const historyDiv = document.getElementById('history');

  // Create a new block for this QA pair
  const block = document.createElement('div');
  block.className = 'qa-block';
  block.innerHTML = `
    <div class="user-q"><strong>Q:</strong> ${esc(question)}</div>
    <div class="bot-a"><em>Thinking…</em></div>
  `;

  // Prepend so the newest is at the top
  historyDiv.prepend(block);
  e.target.reset();

  try {
    const res = await fetch('/api/query', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question: question })
    });

    if (!res.ok) throw new Error("API Error");
    const data = await res.json();

    // Build the Answer section
    const tags = [];
    if (data.refusal) tags.push('refusal');
    tags.push(data.validated ? 'validated' : 'NOT validated');
    if (data.grounded) tags.push('grounded');
    if (data.cache_hit) tags.push('cache-hit');
    tags.push('iterations: ' + data.iterations);

    let botHtml = `<div class="md-content">${renderMd(data.answer)}</div>`;
    botHtml += `<div class="badges">${tags.join(' | ')}</div>`;

    if (data.warning) {
      botHtml += `<p class="warning">⚠ ${data.warning}</p>`;
    }

    // Build the Loop Inspector (inside a collapsible <details> tag)
    let inspectorHtml = '<details><summary>Inspect Evaluator Loop</summary>';
    inspectorHtml += '<div class="inspector-content">';

    (data.trace || []).forEach(t => {
      const ev = t.evaluation;
      inspectorHtml += `<div class="iteration">`;
      inspectorHtml += `<h3>Iteration ${t.iteration}</h3>`;
      inspectorHtml += `<div class="md-content">${renderMd(t.answer)}</div>`;

      if (ev) {
        inspectorHtml += `
          <p style="margin-top: 1rem;"><strong>Verdict:</strong> ${ev.is_acceptable ? 'Acceptable' : 'Needs improvement'}</p>
          <p>Scores — accuracy ${ev.accuracy}/5 · relevance ${ev.relevance}/5 · completeness ${ev.completeness}/5 · consistency ${ev.consistency_with_sources}/5</p>
          <p>Grounded: ${ev.grounded}</p>
        `;
      }
      if (t.feedback) {
        inspectorHtml += `<div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #eee;">
                            <strong>Feedback:</strong>
                            <div class="md-content">${renderMd(t.feedback)}</div>
                          </div>`;
      }
      inspectorHtml += `</div>`;
    });
    inspectorHtml += '</div></details>';

    // Replace "Thinking..." with the actual answer
    block.querySelector('.bot-a').innerHTML = botHtml + inspectorHtml;

  } catch (error) {
    block.querySelector('.bot-a').innerHTML = '<p class="warning">⚠ An error occurred connecting to the server.</p>';
  }
});
</script>
{% endblock %}
