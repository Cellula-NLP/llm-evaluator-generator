{% extends "base.html" %}
{% block content %}
<h1>Ingest</h1>

<section class="card">
  <h2 style="margin-top: 0;">Upload File</h2>
  <form id="upload-form" style="flex-direction: row;">
    <input type="file" name="file" required>

    <select name="kind" style="width: auto; min-width: 150px;">
      <option value="">Auto-detect</option>
      <option value="pdf">PDF</option>
      <option value="docx">DOCX</option>
      <option value="pptx">PPTX</option>
      <option value="txt">TXT</option>
      <option value="code">Code</option>
      <option value="audio">Audio (WAV)</option>
    </select>

    <button type="submit">Upload</button>
  </form>
  <pre id="upload-result" style="display: none; margin-top: 1rem;"></pre>
</section>

<section class="card">
  <h2 style="margin-top: 0;">Ingest URL</h2>
  <form id="url-form">
    <input type="url" name="url" placeholder="https://..." required style="flex: 1;">

    <select name="kind" style="width: auto; min-width: 120px;">
      <option value="auto">Auto</option>
      <option value="web">Web</option>
      <option value="wikipedia">Wikipedia</option>
    </select>

    <button type="submit">Ingest</button>
  </form>
  <pre id="url-result" style="display: none; margin-top: 1rem;"></pre>
</section>

<script>
document.getElementById('upload-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  for (const [k, v] of [...fd.entries()]) if (!v) fd.delete(k);
  const pre = document.getElementById('upload-result');
  pre.style.display = 'block';
  pre.textContent = "Uploading...";
  const res = await fetch('/api/ingest/file', { method: 'POST', body: fd });
  pre.textContent = JSON.stringify(await res.json(), null, 2);
});
document.getElementById('url-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const pre = document.getElementById('url-result');
  pre.style.display = 'block';
  pre.textContent = "Fetching...";
  const res = await fetch('/api/ingest/url', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
  });
  pre.textContent = JSON.stringify(await res.json(), null, 2);
});
</script>
{% endblock %}
